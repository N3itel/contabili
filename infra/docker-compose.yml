# Servicios locales para desarrollo: PostgreSQL.
# Uso: docker compose -f infra/docker-compose.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contabili
      POSTGRES_PASSWORD: contabili
      POSTGRES_DB: contabili
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contabili -d contabili']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
